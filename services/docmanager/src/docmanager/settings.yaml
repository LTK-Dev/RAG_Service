server:
  host: "0.0.0.0"
  port: 3001
  reload: True

postgres:
  host: "postgres_db"
  port: 5432

minio:
  endpoint: "minio:9000"
  bucket: "documents"
  secure: False

embedding:
  model: "Alibaba-NLP/gte-multilingual-base"

opensearch:
  host: "opensearch_node"
  port: 9200
  index_name: "rag_documents"
  use_ssl: False
  verify_certs: False
  ssl_assert_hostname: False
